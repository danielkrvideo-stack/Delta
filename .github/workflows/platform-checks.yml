name: Platform checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS application
        run: swift build -c release --arch x86_64

  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Windows x64 application
        run: dotnet publish Platforms/Delta.CrossPlatform/Delta.CrossPlatform.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o .build/windows
      - name: Verify executable and offline game are packaged
        shell: pwsh
        run: |
          if (!(Test-Path .build/windows/Delta.exe)) { throw "Delta.exe is missing." }
          if (!(Test-Path .build/windows/dino.html)) { throw "Offline game is missing." }
          if (!(Test-Path .build/windows/Microsoft.Web.WebView2.WinForms.dll)) { throw "WebView2 is missing." }
      - name: Run browser smoke test on Windows
        shell: pwsh
        run: |
          dotnet .build/windows/Delta.dll --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Windows browser smoke test failed with exit code $LASTEXITCODE." }

  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK, WebKitGTK, and headless display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libwebkit2gtk-4.1-0 xvfb
      - name: Check Python syntax
        run: /usr/bin/python3 -m py_compile Platforms/Linux/delta.py
      - name: Launch browser and verify core behavior
        run: xvfb-run -a /usr/bin/python3 Platforms/Linux/delta.py --smoke-test
