name: Build and publish cross-platform release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Delta.app
        env:
          DELTA_VERSION: ${{ github.ref_name }}
          DELTA_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="${DELTA_VERSION#v}"
          DELTA_VERSION="$VERSION" bash ./build-app.sh

      - name: Package Intel app
        run: |
          ditto -c -k --sequesterRsrc --keepParent Delta.app Delta-macos-intel.zip
          shasum -a 256 Delta-macos-intel.zip > Delta-macos-intel.zip.sha256
          VERSION="${GITHUB_REF_NAME#v}"
          DELTA_VERSION="$VERSION" DELTA_APP_ALREADY_BUILT=true bash Packaging/build-macos-dmg.sh
          shasum -a 256 "Delta-macos-intel-${VERSION}.dmg" > "Delta-macos-intel-${VERSION}.dmg.sha256"

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            Delta-macos-intel.zip
            Delta-macos-intel.zip.sha256
            Delta-macos-intel-*.dmg
            Delta-macos-intel-*.dmg.sha256
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install WiX v4
        run: dotnet tool install --global wix --version 4.0.5

      - name: Build Windows x64 app and installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          ./Packaging/Windows/build.ps1 -Version $version
          $msi = "Delta-windows-x64-$version.msi"
          $zip = "Delta-windows-x64-$version.zip"
          if (!(Test-Path $msi)) { throw "Windows MSI was not created." }
          if (!(Test-Path $zip)) { throw "Portable Windows package was not created." }
          foreach ($file in @($msi, $zip)) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $file" | Set-Content "$file.sha256"
          }

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            Delta-windows-x64-*.msi
            Delta-windows-x64-*.msi.sha256
            Delta-windows-x64-*.zip
            Delta-windows-x64-*.zip.sha256
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux packaging tools and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev gir1.2-gtk-3.0 gir1.2-webkit2-4.0 \
            libfuse2 libwebkit2gtk-4.0-37 pipx python3-gi rpm
          pipx install appimage-builder
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build DEB, RPM, and AppImage packages
        env:
          DELTA_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${DELTA_VERSION#v}"
          DELTA_VERSION="$VERSION" bash Packaging/build-linux-packages.sh
          for package in \
            "Delta-linux-amd64-$VERSION.deb" \
            "Delta-linux-x86_64-$VERSION.rpm" \
            "Delta-linux-x86_64-$VERSION.AppImage"; do
            test -s "$package" || { echo "Missing Linux package: $package"; exit 1; }
          done
          chmod +x "Delta-linux-x86_64-$VERSION.AppImage"
          sha256sum Delta-linux-* > Delta-linux-SHA256SUMS

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            Delta-linux-*.deb
            Delta-linux-*.rpm
            Delta-linux-*.AppImage
            Delta-linux-SHA256SUMS
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK and App Bundle
        env:
          DELTA_VERSION: ${{ github.ref_name }}
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          VERSION="${DELTA_VERSION#v}"
          signing_values=(
            "$ANDROID_SIGNING_KEY_BASE64"
            "$ANDROID_SIGNING_STORE_PASSWORD"
            "$ANDROID_SIGNING_KEY_ALIAS"
            "$ANDROID_SIGNING_KEY_PASSWORD"
          )
          signing_count=0
          for value in "${signing_values[@]}"; do
            [[ -z "$value" ]] || ((signing_count+=1))
          done
          if [[ "$signing_count" -ne 0 && "$signing_count" -ne 4 ]]; then
            echo "Configure all Android signing secrets or leave all unset."
            exit 1
          fi
          if [[ "$signing_count" -eq 4 ]]; then
            printf '%s' "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/delta-upload.jks"
            export DELTA_RELEASE_STORE_FILE="$RUNNER_TEMP/delta-upload.jks"
            export DELTA_RELEASE_STORE_PASSWORD="$ANDROID_SIGNING_STORE_PASSWORD"
            export DELTA_RELEASE_KEY_ALIAS="$ANDROID_SIGNING_KEY_ALIAS"
            export DELTA_RELEASE_KEY_PASSWORD="$ANDROID_SIGNING_KEY_PASSWORD"
            signed_suffix=""
          else
            signed_suffix="-unsigned"
          fi
          DELTA_VERSION="$VERSION" ./gradlew --no-daemon testDebugUnitTest assembleDebug bundleRelease
          cp app/build/outputs/apk/debug/app-debug.apk "Delta-android-${VERSION}-debug.apk"
          cp app/build/outputs/bundle/release/app-release.aab "Delta-android-${VERSION}${signed_suffix}.aab"
          sha256sum Delta-android-*.apk Delta-android-*.aab > Delta-android-SHA256SUMS

      - name: Upload Android release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: |
            Delta-android-*.apk
            Delta-android-*.aab
            Delta-android-SHA256SUMS
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux, build-android]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "Delta $GITHUB_REF_NAME" \
              --generate-notes
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
